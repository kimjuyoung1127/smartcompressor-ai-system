<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오디오 스펙트로그램 라벨링 툴 · UI</title>

  <!-- Font Awesome (fix rel typo) -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

  <!-- App CSS -->
  <link href="labeling_tool.css" rel="stylesheet" />
  <link href="/static/css/dashboard_mobile_responsive.css" rel="stylesheet" />

  <!-- Annotorious (for overlay UI skin only; logic will be in JS file later) -->
  <link rel="stylesheet" href="https://unpkg.com/@recogito/annotorious@2.3.0/dist/annotorious.min.css" />

  <!-- App Specific CSS -->
  <link href="audio_spectrogram_labeling.css" rel="stylesheet" />
</head>
<body>
  <main id="main-content">
    <header class="page-header">
      <div class="header-left">
        <h1>오디오 스펙트로그램 라벨링 툴</h1>
        <div class="metric-badges" aria-live="polite">
          <span class="metric"><i class="fa-solid fa-inbox"></i><b id="m-queue">0</b> 대기</span>
          <span class="metric"><i class="fa-regular fa-circle-check"></i><b id="m-done-today">0</b> 오늘 완료</span>
          <span class="metric"><i class="fa-regular fa-clock"></i>평균 <b id="m-avg">—</b></span>
        </div>
      </div>
      <div class="tool-group">
        <button class="chip" id="theme-toggle" aria-label="다크/라이트 전환"><i class="fa-solid fa-moon"></i> 테마</button>
        <div class="tool-group" role="group" aria-label="보기 설정">
          <span class="chip" id="snap-toggle" data-active="true" title="그리드 스냅 (G)"><i class="fa-solid fa-magnet"></i> 스냅</span>
          <span class="chip" id="grid-toggle" data-active="true" title="그리드 표시 (H)"><i class="fa-solid fa-border-all"></i> 그리드</span>
          <span class="chip" id="harmonic-toggle" title="하모닉 가이드 표시 (A)"><i class="fa-solid fa-wave-square"></i> 하모닉</span>
        </div>
      </div>
    </header>

    <div class="tool-container">
      <!-- Left Panel: Queue -->
      <aside class="panel left-panel" aria-label="라벨링 대기열">
        <div class="queue-toolbar">
          <input id="q-search" type="text" placeholder="파일명/메모 검색" aria-label="검색" />
          <select id="q-filter-status" aria-label="상태">
            <option value="pending">미처리</option>
            <option value="all">전체</option>
            <option value="done">완료</option>
          </select>
          <button id="upload-btn" class="chip" title="오디오 파일 업로드"><i class="fa-solid fa-upload"></i> 파일 업로드</button>
          <button id="refresh-btn" class="chip" title="목록 새로고침"><i class="fa-solid fa-sync-alt"></i></button>
          <input type="file" id="file-upload" accept=".wav,.mp3,.flac,.m4a" style="display: none;" multiple>
        </div>
        <ul id="queue" class="file-list" role="listbox" aria-label="파일 목록">
          <!-- populated by JS -->
        </ul>
      </aside>

      <!-- Center Panel: Work Area -->
      <section class="panel center-panel" aria-label="작업 영역">
        <div class="toolbar">
          <div class="tool-group">
            <button class="chip" id="zoom-out" title="줌 아웃 (-)"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
            <button class="chip" id="zoom-in" title="줌 인 (=)"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
            <span class="timefreq-indicator">
              <i class="fa-regular fa-clock"></i>
              <span id="t-ind">00:00.0 / 00:00.0</span>
              <span style="width:10px"></span>
              <i class="fa-solid fa-wave-square"></i>
              <span id="f-ind">— Hz</span>
            </span>
          </div>
          <div class="tool-group">
            <label class="chip" title="재생 속도">
              <i class="fa-solid fa-gauge-high"></i>
              <select id="playback-speed" aria-label="속도">
                <option value="0.5">0.5x</option>
                <option value="0.75">0.75x</option>
                <option value="1" selected>1x</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
                <option value="2">2x</option>
              </select>
            </label>
          </div>
        </div>

        <div class="spectrogram-wrap" aria-label="스펙트로그램">
          <!-- Wavesurfer Spectrogram plugin will render into this container -->
          <div id="spectrogram" class="spectrogram" aria-hidden="true"></div>
          <!-- Annotorious overlay will attach to spectrogram canvas later -->
          <div class="cursor-overlay"><div class="vertical-cursor" id="time-cursor" style="left:0"></div></div>
        </div>

        <div id="waveform" class="waveform" aria-label="파형"></div>
        <div id="timeline" class="timeline" aria-label="타임라인"></div>

        <div class="audio-controls" role="group" aria-label="오디오 컨트롤">
          <button class="control-btn primary" id="play-btn" title="재생/일시정지 (Space)"><i class="fa-solid fa-play"></i></button>
          <button class="control-btn" id="backward" title="0.1초 뒤로 (←)"><i class="fa-solid fa-backward-step"></i></button>
          <button class="control-btn" id="forward" title="0.1초 앞으로 (→)"><i class="fa-solid fa-forward-step"></i></button>
          <button class="control-btn" id="loop-btn" title="루프 토글 (L)"><i class="fa-solid fa-repeat"></i></button>
        </div>
      </section>

      <!-- Right Panel: Tools -->
      <aside class="panel right-panel" aria-label="라벨 도구">
        <section class="label-section" aria-labelledby="label-header">
          <h3 id="label-header"><i class="fa-solid fa-tags"></i> 라벨 선택</h3>
          <div class="label-grid" id="label-grid">
            <button class="label-btn" data-label="normal" data-active="true" aria-pressed="true">
              <span class="label-pill"><i class="fa-solid fa-circle-check"></i> normal</span>
              <span class="shortcut">(1)</span>
            </button>
            <button class="label-btn" data-label="warning">
              <span class="label-pill"><i class="fa-solid fa-triangle-exclamation"></i> warning</span>
              <span class="shortcut">(2)</span>
            </button>
            <button class="label-btn" data-label="critical">
              <span class="label-pill"><i class="fa-solid fa-circle-exclamation"></i> critical</span>
              <span class="shortcut">(3)</span>
            </button>
            <button class="label-btn" data-label="unknown">
              <span class="label-pill"><i class="fa-solid fa-circle-question"></i> unknown</span>
              <span class="shortcut">(4)</span>
            </button>
          </div>
        </section>

        <section style="margin-top:14px">
          <label class="slider-row" for="confidence">
            <span>신뢰도</span>
            <input id="confidence" type="range" min="0" max="100" value="90" />
            <input id="confidence-num" type="number" min="0" max="100" value="90" style="width:56px" />
          </label>
        </section>

        <section style="margin-top:12px">
          <label for="notes">메모</label>
          <textarea id="notes" rows="5" placeholder="라벨링 관련 메모" style="width:100%; background:var(--chip-bg); color:var(--text-primary); border:1px solid var(--border-color); border-radius:10px; padding:10px;"></textarea>
        </section>

        <section style="margin-top:12px; display:flex; align-items:center; justify-content:space-between; gap:8px; color:var(--text-secondary); font-size:12px;">
          <div>자동저장 <span class="autosave-dot" id="autosave-dot" data-state="saved"></span></div>
          <div><i class="fa-regular fa-keyboard"></i> 단축키: 1–4, Space, L, ←/→</div>
        </section>

        <div class="action-grid">
          <button class="action-btn" id="undo-btn" title="되돌리기 (Ctrl/Cmd+Z)"><i class="fa-solid fa-rotate-left"></i> 되돌리기</button>
          <button class="action-btn" id="redo-btn" title="다시실행 (Shift+Z)"><i class="fa-solid fa-rotate-right"></i> 다시실행</button>
          <button class="action-btn save" id="save-btn"><i class="fa-solid fa-cloud-arrow-up"></i> 저장</button>
          <button class="action-btn next" id="next-btn"><i class="fa-solid fa-circle-right"></i> 다음 파일</button>
        </div>
      </aside>
    </div>
  </main>

  <!-- Wavesurfer core & plugins (using v6 to match legacy code) -->
  <script src="https://unpkg.com/wavesurfer.js@6.6.4/dist/wavesurfer.js" defer></script>
  <script src="https://unpkg.com/wavesurfer.js@6.6.4/dist/plugin/wavesurfer.spectrogram.min.js" defer></script>
  <script src="https://unpkg.com/wavesurfer.js@6.6.4/dist/plugin/wavesurfer.regions.min.js" defer></script>
  <script src="https://unpkg.com/wavesurfer.js@6.6.4/dist/plugin/wavesurfer.timeline.min.js" defer></script>
  <script src="https://unpkg.com/@recogito/annotorious@2.3.0/dist/annotorious.min.js"></script>

  <!-- UI-only micro interactions -->
  <script src="audio_spectrogram_labeling_ui.js" defer></script>

  <!-- App logic (to be implemented next; keeps UI clean) -->
  <script src="/static/js/auth-manager.js" defer></script>
  <script src="audio_spectrogram_labeling.js" defer></script>
</body>
</html>
