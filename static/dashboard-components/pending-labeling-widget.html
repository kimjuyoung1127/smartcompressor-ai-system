<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보류 라벨링 대시보드</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .pending-item {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background: #fff;
            transition: box-shadow 0.2s;
        }
        .pending-item:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .confidence-bar {
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
        }
        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #dc3545 0%, #ffc107 50%, #28a745 100%);
            transition: width 0.3s;
        }
        .audio-player {
            width: 100%;
            margin: 10px 0;
        }
        .label-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container-fluid mt-4">
        <h1 class="mb-4">📋 보류 라벨링 대시보드</h1>
        
        <!-- 통계 카드 -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="stat-card">
                    <h5>전체 보류</h5>
                    <h2 id="total-pending">-</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                    <h5>라벨링 대기</h5>
                    <h2 id="pending-count">-</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
                    <h5>라벨링 완료</h5>
                    <h2 id="completed-count">-</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">
                    <h5>자동 판단률</h5>
                    <h2 id="auto-rate">-</h2>
                </div>
            </div>
        </div>
        
        <!-- 필터 -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4">
                        <label class="form-label">디바이스 필터</label>
                        <select class="form-select" id="device-filter">
                            <option value="">전체</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">신뢰도 필터</label>
                        <input type="range" class="form-range" id="confidence-filter" min="0" max="100" value="0">
                        <small>최소 신뢰도: <span id="confidence-value">0%</span></small>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">&nbsp;</label>
                        <button class="btn btn-primary w-100" onclick="loadPendingItems()">새로고침</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 보류 항목 목록 -->
        <div id="pending-items-container">
            <div class="text-center">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">로딩 중...</span>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // API 기본 URL
        const API_BASE = '/api/pending';
        
        // 보류 항목 로드
        async function loadPendingItems() {
            try {
                const deviceId = document.getElementById('device-filter').value;
                const confidence = document.getElementById('confidence-filter').value / 100;
                
                let url = `${API_BASE}/items?limit=50`;
                if (deviceId) url += `&device_id=${deviceId}`;
                
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.success) {
                    displayPendingItems(data.items.filter(item => item.confidence >= confidence));
                    updateStatistics(data.statistics);
                }
            } catch (error) {
                console.error('보류 항목 로드 실패:', error);
            }
        }
        
        // 보류 항목 표시
        function displayPendingItems(items) {
            const container = document.getElementById('pending-items-container');
            
            if (items.length === 0) {
                container.innerHTML = '<div class="alert alert-info">보류 항목이 없습니다.</div>';
                return;
            }
            
            container.innerHTML = items.map(item => `
                <div class="pending-item" id="item-${item.id}">
                    <div class="row">
                        <div class="col-md-8">
                            <h5>${item.id}</h5>
                            <p class="text-muted mb-2">
                                <strong>디바이스:</strong> ${item.device_id} | 
                                <strong>시간:</strong> ${new Date(item.timestamp).toLocaleString('ko-KR')}
                            </p>
                            <p class="mb-2">
                                <strong>예측:</strong> ${item.predicted_class} | 
                                <strong>방법:</strong> ${item.method}
                            </p>
                            <div class="mb-2">
                                <strong>신뢰도:</strong> ${(item.confidence * 100).toFixed(1)}%
                                <div class="confidence-bar mt-1">
                                    <div class="confidence-fill" style="width: ${item.confidence * 100}%"></div>
                                </div>
                            </div>
                            <audio controls class="audio-player">
                                <source src="${API_BASE}/items/${item.id}/audio" type="audio/wav">
                            </audio>
                        </div>
                        <div class="col-md-4">
                            <h6>라벨 선택</h6>
                            <div class="label-buttons">
                                <button class="btn btn-success btn-sm" onclick="labelItem('${item.id}', 'normal')">
                                    ✅ 정상
                                </button>
                                <button class="btn btn-danger btn-sm" onclick="labelItem('${item.id}', 'abnormal_bearing')">
                                    ⚠️ 베어링
                                </button>
                                <button class="btn btn-danger btn-sm" onclick="labelItem('${item.id}', 'abnormal_overload')">
                                    🚨 과부하
                                </button>
                                <button class="btn btn-warning btn-sm" onclick="labelItem('${item.id}', 'abnormal_friction')">
                                    ⚡ 마찰
                                </button>
                                <button class="btn btn-warning btn-sm" onclick="labelItem('${item.id}', 'abnormal_unbalance')">
                                    🔄 불균형
                                </button>
                                <button class="btn btn-secondary btn-sm" onclick="rejectItem('${item.id}')">
                                    ❌ 거부
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        // 통계 업데이트
        function updateStatistics(stats) {
            document.getElementById('total-pending').textContent = stats.total || 0;
            document.getElementById('pending-count').textContent = stats.pending || 0;
            document.getElementById('completed-count').textContent = stats.completed || 0;
        }
        
        // 라벨링 완료
        async function labelItem(itemId, label) {
            if (!confirm(`"${label}"로 라벨링하시겠습니까?`)) return;
            
            try {
                const response = await fetch(`${API_BASE}/items/${itemId}/label`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        label: label,
                        labeled_by: 'current_user',  // 실제로는 세션에서 가져옴
                        expert_confidence: 0.95
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('라벨링이 완료되었습니다!');
                    loadPendingItems();  // 목록 새로고침
                } else {
                    alert('라벨링 실패: ' + data.error);
                }
            } catch (error) {
                console.error('라벨링 실패:', error);
                alert('라벨링 중 오류가 발생했습니다.');
            }
        }
        
        // 항목 거부
        async function rejectItem(itemId) {
            if (!confirm('이 항목을 거부하시겠습니까?')) return;
            
            try {
                const response = await fetch(`${API_BASE}/items/${itemId}/reject`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        reason: '사용자 거부'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('항목이 거부되었습니다.');
                    loadPendingItems();
                }
            } catch (error) {
                console.error('거부 실패:', error);
            }
        }
        
        // 신뢰도 필터 업데이트
        document.getElementById('confidence-filter').addEventListener('input', function(e) {
            document.getElementById('confidence-value').textContent = e.target.value + '%';
            loadPendingItems();
        });
        
        // 초기 로드
        loadPendingItems();
        setInterval(loadPendingItems, 30000);  // 30초마다 자동 새로고침
    </script>
</body>
</html>
