<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignalCraft 관리자 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/dashboard_v3.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card bg-dark text-light">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4">관리자 등록</h3>
                        <form id="registerForm">
                            <div class="mb-3">
                                <label for="password" class="form-label">비밀번호</label>
                                <input type="password" class="form-control bg-dark text-light" id="password" required>
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">비밀번호 확인</label>
                                <input type="password" class="form-control bg-dark text-light" id="confirmPassword" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">등록</button>
                        </form>
                        <div id="message" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const registerForm = document.getElementById('registerForm');
            const messageDiv = document.getElementById('message');
            
            registerForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                
                if (password !== confirmPassword) {
                    messageDiv.innerHTML = '<div class="alert alert-danger">비밀번호가 일치하지 않습니다.</div>';
                    return;
                }

                const urlParams = new URLSearchParams(window.location.search);
                const token = urlParams.get('token');

                if (!token) {
                    messageDiv.innerHTML = '<div class="alert alert-danger">초대 토큰이 없습니다.</div>';
                    return;
                }

                try {
                    const response = await fetch('/api/admin-invites/register-admin', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ token, password, confirmPassword })
                    });

                    const data = await response.json();

                    if (data.success) {
                        messageDiv.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
                        setTimeout(() => {
                            window.location.href = '/'; // 로그인 페이지로 리디렉션
                        }, 2000);
                    } else {
                        messageDiv.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
                    }
                } catch (error) {
                    console.error('등록 오류:', error);
                    messageDiv.innerHTML = '<div class="alert alert-danger">등록 중 오류가 발생했습니다.</div>';
                }
            });
        });
    </script>
</body>
</html>
